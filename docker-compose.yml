services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      # Required, read from .env -- see .env.example.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port 5433, not 5432 -- avoids clashing with a locally
      # installed Postgres that may already be listening on 5432.
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

volumes:
  timescale_data:
