# nginx.conf
#
# Serves the compiled dashboard as a single-page application.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the client-side routes (/detections, /zones), and
    # nginx knows nothing about them -- a direct load or refresh of one
    # would 404 against the filesystem. Falling back to index.html lets
    # the router resolve the path once the bundle boots.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must not be cached or
    # a deploy would keep serving the previous bundle's asset references.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
